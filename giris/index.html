*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}
.hero{position:relative;height:100svh;min-height:620px;max-height:1100px;overflow:hidden;background:var(--surface)}

#stage { position: absolute; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.ui { position: absolute; z-index: 5; pointer-events: none; }
.ui > * { pointer-events: auto; }
.top { top: calc(env(safe-area-inset-top, 0px) + 20px); left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
.brand { display: flex; gap: 8px; align-items: center; font-weight: 600; font-size: 15px; color: var(--ink); text-decoration: none; }
.brand i { width: 10px; height: 10px; border-radius: 3px; background: var(--brand); }
.thesis { max-width: 560px; display: grid; gap: 10px; }
.thesis h1 { font-size: clamp(30px, 4.6vw, 56px); line-height: 1.02; letter-spacing: -.025em; margin: 18px 0 0; font-weight: 700; text-wrap: balance; }
.thesis h1 span { color: var(--brand); }
.thesis p { margin: 0; font-size: 16px; line-height: 1.45; color: var(--ink-muted); max-width: 44ch; }
.shop { font-size: 13px; font-weight: 600; color: var(--ink); text-decoration: none; padding: 9px 14px; border-radius: 980px; background: var(--glass-fill); border: 1px solid var(--glass-stroke); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); white-space: nowrap; }
.bottom { bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.spec { font-family: var(--font-mono); font-size: 12px; color: var(--ink-muted); display: flex; gap: 6px 18px; flex-wrap: wrap; }
.controls { display: flex; gap: 8px; flex-wrap: wrap; }
.seg { display: inline-flex; padding: 3px; border-radius: 980px; background: var(--glass-fill); border: 1px solid var(--glass-stroke); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); }
.seg button { font: 500 13px var(--font-sans); color: var(--ink); background: none; border: 0; padding: 8px 14px; border-radius: 980px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.seg button:focus-visible, .lbl:focus-visible, .shop:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
#labels { position: absolute; inset: 0; z-index: 4; pointer-events: none; }
.lbl { position: absolute; left: 0; top: 0; transform: translate(-50%, -100%); pointer-events: auto; display: flex; flex-direction: column; align-items: center; gap: 6px; text-decoration: none; color: var(--ink); }
.lbl .pill { display: flex; align-items: center; gap: 7px; padding: 7px 12px 7px 10px; border-radius: 980px; background: var(--glass-fill); border: 1px solid var(--glass-stroke); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); font-size: 13px; font-weight: 600; white-space: nowrap; transition: transform .2s ease, background .2s ease, color .2s ease; }
.lbl .pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--brand); flex: none; }
.lbl .pill small { font-weight: 500; color: var(--ink-muted); font-size: 12px; }
.lbl .stem { width: 1px; height: 18px; background: var(--ink); opacity: .35; }
.lbl.on .pill { background: var(--brand); color: var(--on-action); transform: translateY(-3px); border-color: transparent; }
.lbl.on .pill small { color: var(--on-action); opacity: .85; }
.lbl.on .pill i { background: var(--on-action); }
.lbl.back { opacity: 0; pointer-events: none; }
.fallback { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: var(--ink-muted); }
@media (max-width: 734px) {
  .thesis h1 { margin-top: 12px; }
  .thesis p { font-size: 14px; }
  .lbl .pill small { display: none; }
  .lbl .pill { font-size: 12px; padding: 6px 10px 6px 8px; }
  .spec { display: none; }
}
@media (prefers-reduced-motion: reduce) { .lbl .pill { transition: none; } }

.scroll-cue{position:absolute;z-index:5;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 74px);font-size:13px;font-weight:600;color:var(--ink);text-decoration:none;padding:8px 14px 8px 12px;border-radius:980px;background:var(--glass-fill);border:1px solid var(--glass-stroke);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);display:flex;gap:6px;align-items:center}
.scroll-cue::after{content:"";width:7px;height:7px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg) translate(-2px,-2px)}
@media (pointer:coarse){#stage canvas{touch-action:pan-y}}

/* ürünler */
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#urunler{padding-block:88px 96px;scroll-margin-top:0}
.sec-head{display:grid;gap:10px;margin-bottom:28px}
.eyebrow{font-size:13px;font-weight:600;color:var(--accent-text);letter-spacing:.02em}
.sec-head h2{font-family:var(--font-display);font-size:clamp(34px,5vw,56px);line-height:1.05;letter-spacing:-.022em;margin:0;text-wrap:balance}
.sec-head p{margin:0;font-size:19px;line-height:1.45;color:var(--ink-muted);max-width:52ch;min-height:2.9em}
.tabbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;padding-block:12px;margin-bottom:24px;background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:saturate(1.8) blur(20px);backdrop-filter:saturate(1.8) blur(20px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:11;background:var(--bg)}
.tabs{display:inline-flex;gap:2px;padding:3px;border-radius:980px;background:var(--surface);max-width:100%;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{font:500 14px var(--font-sans);color:var(--ink);background:none;border:0;padding:9px 16px;border-radius:980px;cursor:pointer;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tabs button span{font-family:var(--font-mono);font-size:12px;color:var(--ink-subtle)}
.tabs button[aria-selected="true"]{background:var(--surface-raised);box-shadow:0 1px 2px rgba(0,0,0,.08),0 2px 8px rgba(0,0,0,.06);font-weight:600}
.tabs button:focus-visible,.card:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px}
.card{background:var(--surface);border-radius:28px;padding:24px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:14px;min-width:0;transition:transform .25s ease,box-shadow .25s ease}
.card:hover{transform:translateY(-3px);box-shadow:0 18px 40px -18px rgba(0,0,0,.25)}
@media (prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
.card img{width:100%;aspect-ratio:4/3;object-fit:contain}
.ph{aspect-ratio:4/3;border-radius:18px;display:grid;place-items:center;text-align:center;padding:16px;font:12px var(--font-mono);color:var(--ink-subtle);
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:20px 20px;background-position:-1px -1px}
.ph span{background:var(--surface);padding:4px 10px;border-radius:8px}
.card-txt{display:grid;gap:4px;flex:1}
.fam{font-size:12px;font-weight:600;color:var(--ink-subtle)}
.card h3{font-family:var(--font-display);font-size:22px;letter-spacing:-.012em;margin:0;line-height:1.15}
.card p{margin:0;color:var(--ink-muted);line-height:1.4}
.card-foot{display:flex;justify-content:space-between;align-items:center;min-height:32px}
.price{font-weight:600}
.buy{font-size:13px;font-weight:600;color:var(--on-action);background:var(--action);padding:7px 14px;border-radius:980px}
.state{display:inline-flex;gap:8px;align-items:center;font-size:13px;font-weight:600;color:var(--ink-muted)}
.state i{width:8px;height:8px;border-radius:50%;background:var(--gold)}
.state.cad i{background:var(--series-elcilik)} .state.idea i{background:var(--ink-subtle)}
.card[hidden]{display:none}
footer{border-top:1px solid var(--line)}
footer .wrap{padding-block:28px;display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between;color:var(--ink-muted);font-size:12px}
footer a{color:inherit}
/* Çakıl Cam: sahne kontrolleri, etiketler, sekmeler */
.seg{background:var(--pebble-fill-press);border:0;box-shadow:var(--pebble-press);gap:4px}
.seg button{border:1px solid transparent}
.seg button[aria-pressed="true"]{color:var(--ink);background:linear-gradient(var(--pebble-fill),var(--pebble-fill)) padding-box,var(--pebble-rim) border-box;box-shadow:var(--pebble-raise);font-weight:600}
.lbl .pill,.shop,.scroll-cue{border:1px solid transparent;background:linear-gradient(var(--pebble-fill),var(--pebble-fill)) padding-box,var(--pebble-rim) border-box;box-shadow:var(--pebble-raise);-webkit-backdrop-filter:var(--pebble-blur);backdrop-filter:var(--pebble-blur)}
.lbl.on .pill{background:linear-gradient(180deg,#f0613b,var(--action)) padding-box,linear-gradient(150deg,rgba(255,255,255,.7),rgba(255,255,255,0) 45%) border-box;box-shadow:var(--pebble-action);color:var(--on-action)}
.shop:active,.scroll-cue:active{box-shadow:var(--pebble-press)}
.tabs{background:var(--pebble-fill-press);box-shadow:var(--pebble-press);gap:4px;padding:4px}
.tabs button{border:1px solid transparent}
.tabs button[aria-selected="true"]{background:linear-gradient(var(--pebble-fill),var(--pebble-fill)) padding-box,var(--pebble-rim) border-box;box-shadow:var(--pebble-raise)}
/* Giriş kapıları: düz durur, üstüne gelince canlanır */
.kapilar{padding:40px 0 8px;background:var(--bg)}
.kapilar .row{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.kapi{--tone:#5b6770;position:relative;display:block;aspect-ratio:16/9;border-radius:14px;overflow:hidden;color:#fff;text-decoration:none;container-type:size;isolation:isolate;
  background:linear-gradient(160deg,color-mix(in srgb,var(--tone) 55%,#2c2c2e),#1d1d1f 78%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 2px 6px rgba(0,0,0,.10),0 10px 24px rgba(0,0,0,.12);
  transition:transform .45s cubic-bezier(.2,.8,.2,1),box-shadow .45s cubic-bezier(.2,.8,.2,1)}
.kapi-media{position:absolute;inset:0;z-index:-1;opacity:0;transition:opacity .5s ease;background:#fff}
.kapi-media video,.kapi-media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.kapi-media::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(0,0,0,.35) 55%,rgba(0,0,0,.8))}
.kapi-mark{text-shadow:0 1px 8px rgba(0,0,0,.35)}
.kapi-mark{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;padding:0 10px;
  transition:transform .55s cubic-bezier(.2,.8,.2,1);transform-origin:50% 100%}
.kapi-mark small{font:500 10px/1 var(--font-mono);letter-spacing:.14em;text-transform:uppercase;opacity:.7}
.kapi-mark b{font:700 clamp(15px,1.7vw,22px)/1.05 var(--font-display);letter-spacing:-.02em}
.kapi.nest .kapi-mark b{font:600 clamp(20px,2.3vw,30px)/1 var(--font-mono);letter-spacing:.22em;margin-right:-.22em}
.kapi.dog .kapi-mark b{font-weight:800;letter-spacing:.04em;font-size:clamp(17px,2vw,26px)}
.kapi.proj .kapi-media img{transform:scale(1.02);animation:kapiKen 9s ease-in-out infinite alternate;animation-play-state:paused}
.kapi.proj .kapi-media img+img{animation-name:kapiKen,kapiSol;animation-duration:9s,9s;animation-direction:alternate,normal}
@keyframes kapiKen{from{transform:scale(1.02)}to{transform:scale(1.14) translate(-2%,-1%)}}
@keyframes kapiSol{0%,40%{opacity:0}50%,90%{opacity:1}100%{opacity:0}}
@keyframes kapiDon{to{rotate:360deg}}
.kapi:is(:hover,:focus-visible,.live){transform:scale(1.05);z-index:2;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.92),0 6px 14px rgba(0,0,0,.16),0 22px 44px rgba(0,0,0,.24)}
.kapi:is(:hover,:focus-visible,.live) .kapi-media{opacity:1}
.kapi:is(:hover,:focus-visible,.live) .kapi-mark{transform:translateY(calc(50cqh - 100% - 10px)) scale(.8)}
.kapi:is(:hover,:focus-visible,.live) img{animation-play-state:running}
.kapi-mark .arma{height:70cqh;width:auto;filter:drop-shadow(0 6px 12px rgba(0,0,0,.45))}
.kapi.intro:is(:hover,:focus-visible,.live) .kapi-mark{opacity:0;transform:translateY(-50%) scale(.9)}
.kapi.intro .kapi-mark{transition:transform .55s cubic-bezier(.2,.8,.2,1),opacity .35s}
.kapi.intro .kapi-media::after{display:none}
.kapi-mark .dm{height:34cqh;width:auto;margin-bottom:2px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.4))}
.kapi.dog .kapi-mark b{font-size:clamp(14px,1.5vw,19px)}
.kapi:focus-visible{outline:3px solid var(--brand);outline-offset:3px}
.kapi:active{transform:scale(1.02)}
@media (max-width:820px){
  .kapilar .row{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;padding:12px 16px 20px;margin:-12px -16px 0;scrollbar-width:none}
  .kapilar .row::-webkit-scrollbar{display:none}
  .kapi{flex:0 0 68%;scroll-snap-align:center}

}
@media (prefers-reduced-motion:reduce){
  .kapi,.kapi-mark{transition:none}
  .kapi:is(:hover,:focus-visible,.live){transform:none}
  .kapi:is(:hover,:focus-visible,.live) .kapi-mark{transform:translateY(-50%)}
  .kapi img{animation:none!important}
}

<script>
(function () {
  var kapilar = Array.prototype.slice.call(document.querySelectorAll('.kapi'));
  var sakin = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function oynat(k, on) {
    var v = k.querySelector('video'); if (!v || sakin) return;
    if (on) { try { v.currentTime = 0; } catch (e) {} var p = v.play(); if (p && p.catch) p.catch(function () {}); } else v.pause();
  }
  kapilar.forEach(function (k) {
    k.addEventListener('mouseenter', function () { oynat(k, true); });
    k.addEventListener('mouseleave', function () { oynat(k, false); });
    k.addEventListener('focus', function () { oynat(k, true); });
    k.addEventListener('blur', function () { oynat(k, false); });
    var cat = k.dataset.cat;
    if (cat) k.addEventListener('click', function (e) {
      var t = document.querySelector('.tabs [data-cat="' + cat + '"]'); if (!t) return;
      e.preventDefault(); t.click(); document.getElementById('urunler').scrollIntoView({ behavior: sakin ? 'auto' : 'smooth' });
    });
  });
  // Dokunmatik: kaydırırken ortadaki kapı canlanır
  if (matchMedia('(hover: none)').matches && 'IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (es) {
      es.forEach(function (e) { var on = e.intersectionRatio > 0.9; e.target.classList.toggle('live', on); oynat(e.target, on); });
    }, { root: document.querySelector('.kapilar .row'), threshold: [0, 0.9] });
    kapilar.forEach(function (k) { io.observe(k); });
  }
})();
</script>
</body>
</html>
